<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screen Ruler</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="icons/icon48.png" alt="" width="32" height="32" />
      <div>
        <strong>Screen Ruler</strong>
        <span>Measure, inspect &amp; edit</span>
      </div>
    </div>
    <button id="toggle" class="cta" type="button">Activate on this page</button>
    <ul class="keys">
      <li><kbd>⌥</kbd><kbd>⇧</kbd><kbd>S</kbd> Toggle</li>
      <li><kbd>⌥</kbd><kbd>↑</kbd> Parent element</li>
      <li><kbd>⌥</kbd><kbd>↓</kbd> Child element</li>
      <li><kbd>Esc</kbd> Clear / close</li>
    </ul>
    <p class="foot">Pin the extension, then click the icon or use the shortcut on any tab.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
